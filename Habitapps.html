<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Support & Privacy | Habit Pro</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --secondary: #f43f5e;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --subtext: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
        }

        [data-theme="dark"] {
            --bg: #020617;
            --card: #0f172a;
            --text: #f1f5f9;
            --subtext: #94a3b8;
            --border: #1e293b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body { background: var(--bg); color: var(--text); transition: 0.5s; }

        /* --- Custom Navbar --- */
        nav {
            padding: 15px 5%; background: var(--card); border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000;
        }

        .brand { font-size: 1.6rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 12px; }

        .nav-tools { display: flex; gap: 12px; }

        .btn-tool {
            padding: 10px 18px; border-radius: 14px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text); cursor: pointer; font-weight: 700;
            transition: 0.3s; display: flex; align-items: center; gap: 8px;
        }

        .btn-tool:hover { background: var(--primary); color: white; border-color: var(--primary); }

        /* --- Hero Section --- */
        .hero {
            padding: 100px 20px; text-align: center;
            background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.1), transparent);
        }

        .hero h1 { font-size: 4rem; font-weight: 800; letter-spacing: -2px; line-height: 1.1; margin-bottom: 20px; }

        /* --- Main Content --- */
        .main-wrapper { max-width: 1300px; margin: -60px auto 60px; padding: 0 20px; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 40px; }

        @media (max-width: 1024px) { .main-wrapper { grid-template-columns: 1fr; } }

        .policy-container { background: var(--card); padding: 50px; border-radius: 35px; border: 1px solid var(--border); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.05); }

        .section-tag { background: rgba(99, 102, 241, 0.1); color: var(--primary); padding: 6px 14px; border-radius: 100px; font-size: 0.8rem; font-weight: 800; margin-bottom: 15px; display: inline-block; }

        .policy-content h2 { margin: 35px 0 15px; font-size: 1.8rem; display: flex; align-items: center; gap: 15px; }
        .policy-content p { font-size: 1.1rem; color: var(--subtext); margin-bottom: 20px; }

        /* --- Professional Support Form --- */
        .support-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 35px; padding: 40px;
            position: sticky; top: 100px; box-shadow: 0 20px 40px rgba(0,0,0,0.05);
        }

        .form-title { font-size: 1.8rem; margin-bottom: 10px; font-weight: 800; }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 0.9rem; color: var(--text); }
        .input-group input, .input-group textarea, .input-group select {
            width: 100%; padding: 15px; border-radius: 15px; border: 2px solid var(--border);
            background: var(--bg); color: var(--text); outline: none; transition: 0.3s;
        }
        .input-group input:focus, .input-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }

        .submit-button {
            width: 100%; padding: 18px; border-radius: 15px; border: none;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white; font-weight: 800; font-size: 1rem; cursor: pointer;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3); transition: 0.3s;
        }

        .submit-button:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(99, 102, 241, 0.4); }

        /* --- Footer --- */
        footer { padding: 60px 20px; text-align: center; border-top: 1px solid var(--border); margin-top: 50px; }

        /* Success Animation */
        #successMsg {
            display: none; position: fixed; top: 20px; right: 20px; z-index: 2000;
            background: var(--success); color: white; padding: 15px 30px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body data-theme="light">

    <div id="successMsg" class="animate__animated animate__fadeInRight">
        <i class="fas fa-check-circle"></i> Sent Successfully! / Отправлено!
    </div>

    <nav>
        <div class="brand"><i class="fas fa-fingerprint"></i> Habit Pro</div>
        <div class="nav-tools">
            <button class="btn-tool" onclick="toggleLanguage()">
                <i class="fas fa-globe"></i> <span id="langBtnText">Русский</span>
            </button>
            <button class="btn-tool" onclick="toggleTheme()">
                <i class="fas fa-moon" id="themeIcon"></i>
            </button>
        </div>
    </nav>

    <div class="hero animate__animated animate__fadeIn">
        <div class="section-tag" id="tagUpdate">Update: April 2026</div>
        <h1 id="heroTitle">Privacy First. <br>Design Second.</h1>
        <p id="heroSubtitle" style="max-width: 600px; margin: 0 auto; color: var(--subtext); font-size: 1.2rem;">Your data remains on your device. Always.</p>
    </div>

    <div class="main-wrapper">
        <div class="policy-container animate__animated animate__fadeInLeft">
            <div id="policyBody" class="policy-content">
                </div>
        </div>

        <div class="support-sidebar animate__animated animate__fadeInRight">
            <div class="support-card">
                <div class="form-title" id="formTitle">Get in Touch</div>
                <p id="formSub" style="color: var(--subtext); margin-bottom: 30px;">Feedback, Bugs, or Business Ideas.</p>
                
                <form action="https://formspree.io/f/mqakpzvz" method="POST" id="mainForm">
                    <div class="input-group">
                        <label id="lName">Name</label>
                        <input type="text" name="name" placeholder="Muhammadsodik" required>
                    </div>
                    <div class="input-group">
                        <label id="lEmail">Email Address</label>
                        <input type="email" name="_replyto" placeholder="example@gmail.com" required>
                    </div>
                    <div class="input-group">
                        <label id="lType">Inquiry Type</label>
                        <select name="subject">
                            <option value="Bug">Bug Report (Xato)</option>
                            <option value="Feature">New Feature (G'oya)</option>
                            <option value="Question">Question (Savol)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label id="lMsg">Message</label>
                        <textarea name="message" rows="5" placeholder="..." required></textarea>
                    </div>
                    
                    <input type="hidden" name="_language" id="hiddenLang" value="en">

                    <button type="submit" class="submit-button" id="btnSend">Send Message</button>
                </form>
            </div>

            <div style="margin-top: 30px; text-align: center; color: var(--subtext);">
                <p id="followText">Follow Official Socials</p>
                <div style="margin-top: 15px; font-size: 1.8rem; display: flex; justify-content: center; gap: 25px;">
                    <a href="https://t.me/habittracer" target="_blank" style="color: #229ED9;"><i class="fab fa-telegram"></i></a>
                    <a href="mailto:ilmyolida77@gmail.com" style="color: var(--secondary);"><i class="fas fa-envelope"></i></a>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 <b>Safe Media Official</b>. <span id="footerText">Handcrafted for better habits.</span></p>
    </footer>

    <script>
        const translations = {
            en: {
                heroTitle: "Privacy First. <br>Design Second.",
                heroSubtitle: "Your data remains on your device. We don't see it, we don't want it.",
                tagUpdate: "Update: April 2026",
                langBtnText: "Русский",
                formTitle: "Get in Touch",
                formSub: "Found a bug or have an idea? Reach out directly.",
                lName: "Your Name",
                lEmail: "Email Address",
                lType: "Category",
                lMsg: "Description",
                btnSend: "Send Message",
                followText: "Follow Official Socials",
                footerText: "Handcrafted for better habits.",
                content: `
                    <div class="section-tag">LEGAL</div>
                    <h2><i class="fas fa-shield-alt"></i> 1. Information We Collect</h2>
                    <p><b>Habit Pro</b> is an offline-first application. We do not collect personal information like your name, phone number, or contacts. All data you enter (habits, income, expenses) is stored in a secure local database on your <b>Redmi 12</b> or any other device.</p>
                    <h2><i class="fas fa-ad"></i> 2. Advertising & Analytics</h2>
                    <p>We use <b>Google AdMob</b> to provide the app for free. AdMob may use your Advertising ID to show personalized ads. No habit-related data is shared with advertisers.</p>
                    <h2><i class="fas fa-server"></i> 3. No Cloud Tracking</h2>
                    <p>As of April 2026, we do not use Firebase or any cloud synchronization. Your data never leaves your device unless you manually export it.</p>
                `
            },
            ru: {
                heroTitle: "Приватность важнее <br>Дизайна.",
                heroSubtitle: "Ваши данные остаются на вашем устройстве. Мы их не видим и не собираем.",
                tagUpdate: "Обновлено: Апрель 2026",
                langBtnText: "English",
                formTitle: "Связаться с нами",
                formSub: "Нашли баг или есть идея? Напишите нам напрямую.",
                lName: "Ваше имя",
                lEmail: "Email адрес",
                lType: "Категория",
                lMsg: "Описание",
                btnSend: "Отправить сообщение",
                followText: "Наши социальные сети",
                footerText: "Создано для ваших лучших привычек.",
                content: `
                    <div class="section-tag">ЮРИДИЧЕСКАЯ ИНФО</div>
                    <h2><i class="fas fa-shield-alt"></i> 1. Сбор информации</h2>
                    <p><b>Привычки Pro</b> — это офлайн-приложение. Мы не собираем личные данные, такие как имя или номер телефона. Все ваши данные (привычки, финансы) хранятся локально на вашем устройстве.</p>
                    <h2><i class="fas fa-ad"></i> 2. Реклама и Аналитика</h2>
                    <p>Мы используем <b>Google AdMob</b>. Сервис может использовать ваш рекламный ID для показа объявлений. Данные о ваших привычках не передаются третьим лицам.</p>
                    <h2><i class="fas fa-server"></i> 3. Никаких облаков</h2>
                    <p>На данный момент (апрель 2026) мы не используем Firebase. Ваши данные никогда не покидают устройство без вашего согласия.</p>
                `
            }
        };

        let currentLang = 'en';

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ru' : 'en';
            const t = translations[currentLang];
            
            document.getElementById('heroTitle').innerHTML = t.heroTitle;
            document.getElementById('heroSubtitle').innerText = t.heroSubtitle;
            document.getElementById('tagUpdate').innerText = t.tagUpdate;
            document.getElementById('langBtnText').innerText = t.langBtnText;
            document.getElementById('formTitle').innerText = t.formTitle;
            document.getElementById('formSub').innerText = t.formSub;
            document.getElementById('lName').innerText = t.lName;
            document.getElementById('lEmail').innerText = t.lEmail;
            document.getElementById('lType').innerText = t.lType;
            document.getElementById('lMsg').innerText = t.lMsg;
            document.getElementById('btnSend').innerText = t.btnSend;
            document.getElementById('followText').innerText = t.followText;
            document.getElementById('footerText').innerText = t.footerText;
            document.getElementById('policyBody').innerHTML = t.content;
            document.getElementById('hiddenLang').value = currentLang;
        }

        function toggleTheme() {
            const body = document.body;
            const isDark = body.getAttribute('data-theme') === 'dark';
            body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('themeIcon').className = isDark ? 'fas fa-moon' : 'fas fa-sun';
        }

        // Form Submission Logic
        const form = document.getElementById('mainForm');
        form.onsubmit = function(e) {
            // Success msg ko'rsatish
            document.getElementById('successMsg').style.display = 'block';
            setTimeout(() => {
                document.getElementById('successMsg').style.display = 'none';
            }, 4000);
        };

        // Initial Load
        toggleLanguage();
    </script>
</body>
  </html>
